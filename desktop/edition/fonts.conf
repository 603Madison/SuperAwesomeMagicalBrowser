<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SuperAwesomeMagical Browser's fonts: Lexend for the interface (Qt's default font, which Ladybird
  also gives its own pages), for pages that name no font, and for pages that ask for a plain
  sans-serif. The launcher points FONTCONFIG_FILE here, so this affects only the browser; fonts a
  page names are left alone.

  The aliases come before the system's own configuration so that Lexend leads the list (fontconfig
  gives earlier preferences priority), as SuperAwesomeMagicalLinux's 50-superawesomemagical.conf
  does for the whole system. (To try it: fc-match 'sans\-serif'; unescaped, fc-match reads
  "sans-serif" as the family "sans" at size "serif".)
-->
<fontconfig>
  <!-- Lexend comes with the browser, for systems that don't have it. -->
  <dir>@SHARE@/fonts</dir>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Lexend</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Lexend</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Sans Serif</family>
    <prefer><family>Lexend</family></prefer>
  </alias>
  <!-- Ladybird starts every page at font-family: serif (its built-in style sheet), so pages that
       name no font of their own would be in Times. They get Lexend too, as in the Firefox edition;
       pages that name a serif font (Georgia, Times...) keep it. -->
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Lexend</family></prefer>
  </alias>

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
