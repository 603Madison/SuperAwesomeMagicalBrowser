// SuperAwesomeMagical Browser (Firefox skips this first line of an AutoConfig file).
//
// Firefox runs this once at startup with full privileges (see defaults/pref/superawesomemagical.js).
// It only maps the superawesomemagical folder beside it to resource://superawesomemagical/ and
// hands over to modules/Startup.sys.mjs there, which does the rest. Keep it that small: an error
// here is reported to the Browser Console and Firefox carries on as plain Firefox.
try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("superawesomemagical");
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("superawesomemagical", Services.io.newFileURI(dir));
  ChromeUtils.importESModule("resource://superawesomemagical/modules/Startup.sys.mjs").Startup.init();
} catch (e) {
  Cu.reportError(e);
}
