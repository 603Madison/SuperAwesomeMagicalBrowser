# SuperAwesomeMagical Browser for Linux: Ladybird (from Ladybird's own repositories, which keep it up
# to date) with our presets, start page and Lexend. This builds the .deb and the .rpm, installs each
# with Ladybird in Ubuntu and Fedora and runs desktop/check.py there, and publishes releases.
#
# - Every push and pull request: build and check.
# - Run workflow with "release" ticked: build, check and release the version in desktop/release.env.
#   Tick "prerelease" too to publish it without making it the latest release, which is the one
#   SuperAwesomeMagicalLinux's image installs; run again with "release" alone to make it the latest.
#
# Ladybird's own updates need nothing from here: they come with the system's package updates.
name: Linux

on:
  push:
    paths: ["desktop/**", "tools/**", "LICENSE", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["desktop/**", "tools/**", "LICENSE", ".github/workflows/linux.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release the version in desktop/release.env"
        type: boolean
        default: false
      prerelease:
        description: "...as a pre-release (not the latest, which SuperAwesomeMagicalLinux installs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      promote: ${{ steps.v.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT: ${{ inputs.release }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          source desktop/release.env
          version="$VERSION-$RELEASE" publish=false promote=false
          if [ "$RELEASE_INPUT" = true ]; then
            publish=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              # Already out as a pre-release: make that one the latest, as it is.
              if [ "$PRERELEASE_INPUT" != true ] && [ "$(gh release view "v$version" --json isPrerelease -q .isPrerelease)" = true ]; then
                publish=false promote=true
              else
                echo "::error::v$version is already released; raise RELEASE in desktop/release.env"
                exit 1
              fi
            fi
          fi
          { echo "version=$version"; echo "publish=$publish"; echo "promote=$promote"; } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    if: needs.version.outputs.promote != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: desktop/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            desktop/out/*.deb
            desktop/out/*.rpm

  test-deb:
    name: Installed on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", suite: noble }
          - { image: "ubuntu:26.04", suite: resolute }
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages }
      - name: Ladybird's repository, as its download page has it
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.ladybird.org/ladybird.asc -o /etc/apt/keyrings/ladybird.asc
          curl -fsSL https://apt.ladybird.org/ladybird-${{ matrix.suite }}.sources -o /etc/apt/sources.list.d/ladybird.sources
      - name: Install the package (it brings Ladybird) and what the check needs
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./superawesomemagicalbrowser_*_all.deb xvfb imagemagick
      - run: python3 desktop/check.py --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.suite }}
          path: screenshots

  test-rpm:
    name: Installed on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["registry.fedoraproject.org/fedora:44", "registry.fedoraproject.org/fedora:45"]
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages }
      - name: Ladybird's repository, as its download page has it
        run: curl -fsSL https://rpm.ladybird.org/ladybird.repo -o /etc/yum.repos.d/ladybird.repo
      - name: Install the package (it brings Ladybird) and what the check needs
        run: dnf install -y ./superawesomemagicalbrowser-*.x86_64.rpm xorg-x11-server-Xvfb python3
      - run: python3 desktop/check.py

  release:
    name: Release
    needs: [version, build, test-deb, test-rpm]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: packages, path: dist }
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          notes=../release-notes/v$VERSION.md
          [ -f "$notes" ] || { echo "::error::Write $notes first"; exit 1; }
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" "${flags[@]}" \
            --title "SuperAwesomeMagical Browser $VERSION" --notes-file "$notes" *

  promote:
    name: Make the pre-release the latest
    needs: version
    if: needs.version.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
